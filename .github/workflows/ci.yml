name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -coverprofile=coverage.out

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pinned, not "latest": golangci-lint-action@v6's "latest" resolves
          # to a v1.x release (observed: 1.64.8), and v1/v2 have incompatible
          # .golangci.yml schemas. Pinning avoids silently breaking CI again
          # if that resolution ever changes. Bump deliberately, in lockstep
          # with .golangci.yml's schema version, not opportunistically.
          version: v1.64.8
          args: --timeout=5m
